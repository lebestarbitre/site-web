    <img src="images/photo2.jpg" alt="Photo 2" onclick="openGallery(1)">
    <img src="images/photo3.jpg" alt="Photo 3" onclick="openGallery(2)">

<div id="viewer" class="viewer">

    <span class="close" onclick="closeGallery()">&times;</span>

    <button class="previous" onclick="changePhoto(-1)">&#10094;</button>

    <img id="viewer-image" src="" alt="Photo agrandie">

    <button class="next" onclick="changePhoto(1)">&#10095;</button>

</div>
