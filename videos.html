    <h1>Mes vidéos</h1>
    <p>Bienvenue dans ma galerie vidéo !</p>

    <!-- Video thumbnails -->

    <div class="video-gallery">

        <video src="videos/video1.mp4"
               preload="metadata"
               muted
               playsinline
               onclick="openVideo(0)">
        </video>

        <video src="videos/video2.mp4"
               preload="metadata"
               muted
               playsinline
               onclick="openVideo(1)">
        </video>

        <video src="videos/video3.mp4"
               preload="metadata"
               muted
               playsinline
               onclick="openVideo(2)">
        </video>

    </div>

    <!-- Fullscreen video viewer -->

   
<div id="video-viewer" class="video-viewer">

    <button class="video-close"
            onclick="closeVideo()"
            aria-label="Fermer la vidéo">
        &times;
    </button>

    <button class="video-arrow video-prev"
            onclick="changeVideo(-1)"
            aria-label="Vidéo précédente">
        &#10094;
    </button>

    <video id="active-video"
           controls
           playsinline
           preload="metadata">
    </video>

    <button class="video-arrow video-next"
            onclick="changeVideo(1)"
            aria-label="Vidéo suivante">
        &#10095;
    </button>

</div>


    <script src="script.js"></script>
